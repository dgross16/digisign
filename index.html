<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" href="static/main.css">
        <title>DigiSign</title>
        <script defer src="main.js"></script>
    </head>
    <body>
        <div class="container bar">
            <div class="container" style="display:block; max-width: 100%; margin-top: 20px;">
                <h1 id="title">DigiSign.com</h1>
                <p id="subtitle">Digital Signs Made <b>better.</b></p>
            </div>
        </div>
        <div class="container bar">
        </div>

        <div class="content">
            <div class="container" style="flex-direction: column; background-color: yellow; width: 300px; height: 150px;">
                <div class="rectangle" id="test"></div>
                <input type="color" id="colorPicker" value="#008000"
                       style="position: absolute; opacity: 0; width: 1px; height: 1px; border: 0; padding: 0; pointer-events: none;">
            </div>
            <input style="display: none" type="file" id="input" name="file" accept=".pdf" multiple>
        </div>
    </body>
</html>
